content:
  description: TIOVAR TP-C400 is a chloride-process rutile titanium dioxide pigment.
    The supplier describes special inorganic and organic surface treatment and ultra-high
    weather resistance for this grade. It is intended for formulation evaluation where
    durability, weather resistance, gloss, hiding power, dispersibility, chalk resistance
    and color retention are required.
  applications:
  - Formulation evaluation in automotive OEM and refinishing coatings
  - Formulation evaluation in marine paint and aerospace coatings
  - Formulation evaluation in exterior and industrial coatings
  key_features:
  - High durability
  - High gloss
  - High hiding power
  - Excellent chalk resistance and color retention performance
  - Good dispersibility
