content:
  description: TIOVAR TP-S100 is a chloride-process rutile titanium dioxide pigment
    described by the supplier as having special surface treatment. It is intended
    for formulation evaluation in photovoltaic white films and plastic applications
    requiring high UV resistance.
  applications:
  - Formulation evaluation in EVA photovoltaic white film
  - Formulation evaluation in POE photovoltaic white film
  - Formulation evaluation in plastics requiring high UV resistance
  key_features:
  - High whiteness
  - Excellent UV resistance and yellowing resistance
  - Good dispersibility
  - Excellent processing property
