content:
  description: TIOVAR TP-PA120 is a chloride-process rutile titanium dioxide pigment
    described by the supplier as having special surface treatment. It is intended
    for formulation evaluation in laminated decorative base paper.
  applications:
  - Formulation evaluation in decorative paper, especially high-whiteness laminated
    decorative paper
  key_features:
  - Unique bluish tone
  - Stable and bright whiteness
  - Excellent covering power
  - Outstanding retention performance
  - Excellent UV resistance performance
