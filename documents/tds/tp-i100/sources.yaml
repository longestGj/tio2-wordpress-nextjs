    value: '4.0'
    source_id: S002
    source_locator: Page 1 / Specifications / Specific gravity
  - property: Carbon black undertone (CBU)
    value: '12.5'
    source_id: S002
    source_locator: Page 1 / Specifications / Carbon black undertone (CBU)
  - property: Oil absorption, g/100 g
    value: '14'
    source_id: S002
    source_locator: Page 1 / Specifications / Oil absorption
  - property: Mean particle size, micrometres
    value: '0.35'
    source_id: S002
    source_locator: Page 1 / Specifications / Mean particle size
  viscosity_note: The supplier reports outstanding dispersibility and low oil absorption.
    Formulation-specific viscosity must be verified.
  packaging_note: Packaging is not stated in the supplier TDS. The supplied packaging
    artwork is a concept mockup only and is not approved evidence of pack size, label
    text, or legal attribution.
  safety_note: An aligned SDS was not provided for this draft. Confirm the supplied-product
    identifier, issuing entity, emergency contact, and revision before external use.
