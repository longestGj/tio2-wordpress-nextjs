content:
  description: TIOVAR TP-I100 is a chloride-process rutile titanium dioxide pigment.
    The supplier describes this grade as a special titanium dioxide for solvent-based
    and water-based inks. It is intended for formulation evaluation where neutral
    tint, whiteness, hiding power, dispersibility and low oil absorption are required.
  applications:
  - Formulation evaluation in inkjet inks
  - Formulation evaluation in water-based inks
  - Formulation evaluation in correction fluids
  - Formulation evaluation in color pastes
  - Formulation evaluation in coatings with high hiding power requirements
  key_features:
  - Neutral tint
  - High whiteness and high hiding power
  - Outstanding dispersibility
  - Low oil absorption
  technical_data:
  - property: TiO2 content, %
    value: '98'
    source_id: S002
    source_locator: Page 1 / Specifications / TiO2 content
  - property: Rutile content, %
