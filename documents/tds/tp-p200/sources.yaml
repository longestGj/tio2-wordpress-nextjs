content:
  description: TIOVAR TP-P200 is a chloride-process rutile titanium dioxide pigment
    described by the supplier as using special surface treatment technology for plastic
    systems. It is intended for formulation evaluation in exterior plastics.
  applications:
  - Formulation evaluation in high-durability uPVC extruded products, such as profiles,
    plates and exterior furniture
  - Formulation evaluation in PVC calendering films, such as advertising plastic sheeting
  - Formulation evaluation in weather-resistant color masterbatches
  key_features:
  - High weatherability
  - Excellent processing property
  - High color fastness
  - High anti-chalking
