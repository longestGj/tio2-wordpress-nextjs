content:
  description: TIOVAR TP-H100 is a high-purity titanium dioxide grade described by
    the supplier as being produced by a vapor-phase oxidation method. The supplier
    reports high purity, low impurity content, narrow particle size distribution,
    good dispersion and stable quality between batches. It is intended for formulation
    evaluation in high-purity functional applications.
  applications:
  - Formulation evaluation in electronic ceramics including MLCC, PTC, VDR and soft
    ferrite
  - Formulation evaluation in optical glass and battery applications
  - Formulation evaluation in cosmetics, medicine and special metallurgy applications
  key_features:
  - High purity, low impurity content and stable quality
  - High dielectric constant and excellent electrical properties
