content:
  description: TIOVAR TP-C310 is a chloride-process rutile titanium dioxide pigment.
    The supplier describes a special surface treatment for this grade. It is intended
    for formulation evaluation where durability, weather resistance, gloss, hiding
    power, dispersibility, color retention, water dispersibility and storage stability
    are required.
  applications:
  - Formulation evaluation in automotive OEM and water-based automotive topcoats,
    component paints and refinishing coatings
  - Formulation evaluation in water-soluble resin industrial coatings
  - Formulation evaluation in exterior coatings requiring high weather resistance
  key_features:
  - High durability
  - High gloss
  - High hiding power
  - Chalk resistance
  - Excellent water dispersibility and storage stability
  technical_data:
