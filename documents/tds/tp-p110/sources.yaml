content:
  description: TIOVAR TP-P110 is a rutile titanium dioxide pigment described by the
    supplier as produced by a chlorination process with special surface treatment.
    It is intended for formulation evaluation in film products.
  applications:
  - Formulation evaluation in PET film masterbatch
  - Formulation evaluation in PE, PP and other polyolefin masterbatches
  key_features:
  - Excellent dispersion
  - Excellent thermal stability
  - High hiding power and high tinting strength
  - Excellent processing property
