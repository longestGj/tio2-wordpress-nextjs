content:
  description: TIOVAR TP-C200 is a rutile titanium dioxide pigment made by the chloride
    process and given special surface treatment. The supplier describes it for high-PVC
    architectural coatings and dry hiding performance. It is intended for formulation
    evaluation in architectural matte or flat coatings, including systems above the
    critical pigment volume concentration (CPVC).
  applications:
  - Formulation evaluation in interior and exterior architectural coatings
  - Formulation evaluation in high-hiding matte or flat coatings with pigment volume
    concentration above the critical pigment volume concentration (CPVC)
  key_features:
  - Ultra-high dry hiding power
  - Excellent weather resistance
  - Excellent water dispersibility
  - High oil absorption
