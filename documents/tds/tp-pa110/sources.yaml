content:
  description: TIOVAR TP-PA110 is a chloride-process rutile titanium dioxide pigment
    described by the supplier as having special surface treatment. It is intended
    for formulation evaluation in paper products.
  applications:
  - Formulation evaluation in plain paper, grainy paper and printed decorative paper
  - Formulation evaluation in decoration paper, Bible paper, dictionary paper and
    paperboard
  key_features:
  - High whiteness
  - Super UV stability
  - Outstanding opacity and retention performance
  - Excellent dispersion performance in alkaline water systems
  technical_data:
