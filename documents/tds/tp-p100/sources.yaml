content:
  description: TIOVAR TP-P100 is a chloride-process rutile titanium dioxide pigment
    described by the supplier as receiving special inorganic and organic surface treatment.
    It is intended for formulation evaluation in polyolefin color masterbatch and
    plastics.
  applications:
  - Formulation evaluation in polyolefin masterbatch
  - Formulation evaluation in engineering plastics such as PE, PP and ABS
  - Formulation evaluation in PS, its copolymers and rubber
  key_features:
  - Bluish undertone
  - High hiding power and high tinting strength
  - Easy dispersion in many polymers
  - Excellent processing performance
