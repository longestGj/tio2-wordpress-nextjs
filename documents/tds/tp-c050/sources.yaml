content:
  description: TIOVAR TP-C050 is a chloride-process rutile titanium dioxide pigment
    described by the supplier as specially treated, with excellent optical properties
    and lower ion content. It is intended for formulation evaluation in electrophoretic
    paints and general interior coatings.
  applications:
  - Formulation evaluation in electrophoretic primers and the cited secondary and
    finishing electrophoretic coating systems
  - Formulation evaluation in industrial electrophoretic coatings for household appliances,
    electromechanical equipment, hardware and electronics
  - Formulation evaluation in interior architectural paints and industrial coatings
  - Formulation evaluation in powder paints
  - Formulation evaluation in water-borne and solvent-borne inks
  key_features:
  - High whiteness
  - High gloss
  - High hiding power
  - Low ion content
