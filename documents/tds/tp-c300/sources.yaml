    source_locator: Page 1 / Specifications / Specific gravity
  - property: Acid solubility
    value: '0.40'
    source_id: S002
    source_locator: Page 1 / Specifications / acid solubility
  - property: Mean particle size, micrometres
    value: '0.28'
