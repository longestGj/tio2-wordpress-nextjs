content:
  description: TIOVAR TP-C300 is a chloride-process rutile titanium dioxide pigment.
    The supplier describes silicon-aluminum and special organic surface treatment
    for this multi-purpose grade. It is intended for formulation evaluation where
    durability, weather resistance, gloss, hiding power, dispersibility and color
    retention are required.
  applications:
  - Formulation evaluation in automotive OEM and refinishing coatings
  - Formulation evaluation in marine paint and aerospace coatings
  - Formulation evaluation in exterior and architectural coatings
  - Formulation evaluation in coil and powder coatings requiring high weather resistance
  key_features:
  - High durability
  - High gloss
  - High hiding power
  - Multifunction
  technical_data:
  - property: TiO2 content, %
    value: '93'
    source_id: S002
