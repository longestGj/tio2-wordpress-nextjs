content:
  description: TIOVAR TP-I200 is a rutile titanium dioxide pigment made by the chloride
    process and given special surface treatment. The supplier describes it for water-based
    inks and other fields, with dry hiding power and resistance to UV. It is intended
    for formulation evaluation in printing inks requiring high weather resistance.
  applications:
  - Formulation evaluation in water-based printing inks requiring high weather resistance
  key_features:
  - Ultra-high dry hiding power
  - Excellent weather resistance, especially resistance to UV color change
  - Excellent water dispersibility
