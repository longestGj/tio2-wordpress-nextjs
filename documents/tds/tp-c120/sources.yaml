content:
  description: TIOVAR TP-C120 is a chloride-process rutile titanium dioxide pigment described by the supplier as having zirconium-aluminum and special organic surface treatment. It is intended for formulation evaluation in water-based interior and exterior wall emulsion paints.
  applications:
    - Formulation evaluation in water-based interior wall emulsion paint
    - Formulation evaluation in water-based exterior wall emulsion paint
  key_features:
    - Bluish tone
    - High gloss
    - High durability
    - High hiding power
