content:
  description: TIOVAR TP-P300 is a chloride-process rutile titanium dioxide pigment
    described by the supplier as having special surface treatment. It is intended
    for formulation evaluation in polycarbonate systems and polyester applications.
  applications:
  - Formulation evaluation in polycarbonate
  - Formulation evaluation in polycarbonate masterbatch
  - Formulation evaluation in engineering plastics such as PET, PA and ABS
  - Formulation evaluation in PO masterbatch, its copolymers and plastics
  key_features:
  - Strong anti-degradation ability
  - Excellent temperature resistance
  - Good dispersibility
  - Bluish undertone
  - High hiding power and high tinting strength
  - Excellent processing property
