content:
  description: TIOVAR TP-P120 is a chloride-process rutile titanium dioxide pigment
    described by the supplier as having special surface treatment. It is intended
    for formulation evaluation in soft PVC, PVDF and film products.
  applications:
  - Formulation evaluation in soft PVC material
  - Formulation evaluation in EVA, PVDF+PMMA and other solar backsheet film
  key_features:
  - Outstanding dispersibility
  - Excellent thermal stability
  - High hiding power and high tinting strength
  - Excellent processing property
