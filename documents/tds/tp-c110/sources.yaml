content:
  description: TIOVAR TP-C110 is a chloride-process rutile titanium dioxide pigment
    described by the supplier as a multi-purpose grade. It is intended for formulation
    evaluation in solvent and water-based systems, including architectural, industrial
    and decorative coatings, with cited paper applications.
  applications:
  - Formulation evaluation in interior and exterior flat and semi-gloss architectural
    paints, industrial coatings and decorative coatings, especially water-borne systems
  - Formulation evaluation in Bible paper, decorating paper and paperboard production
  key_features:
  - Neutral tint
  - High hiding power
  - High whiteness
  - Good durability
