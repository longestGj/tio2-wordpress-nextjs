fragment ProductPageCollectionLinkFields on Tio2ProductCollectionLink {
  databaseId
  title
  path
}

fragment ProductPageCollectionFaqFields on Tio2ProductCollectionFaq {
  question
  answer
}

fragment ProductPageFamilySummaryFields on Tio2ProductFamilySummary {
  slug
  name
  path
  headline
  directAnswer
  heroImageId
  productCount
}

fragment ProductPageCollectionCardFields on Tio2ProductCollectionCard {
  databaseId
  productId
  slug
  title
  path
  displayOrder
  familyCardSummary
  applicationFocus
  performanceFocus
  surfaceTreatmentPositioning
  filterTags
}

fragment ProductPageSiteScopeFields on SiteScope {
  slug
}

fragment ProductPageApplicationLinkFields on Tio2Application {
  title
  excerpt(format: RENDERED)
  uri
  status
  siteScopes {
    nodes {
      ...ProductPageSiteScopeFields
    }
  }
}

fragment ProductPageResourceLinkFields on Tio2Document {
  title
  uri
  status
  siteScopes {
    nodes {
      ...ProductPageSiteScopeFields
    }
  }
}

fragment ProductPageProductLinkFields on Tio2Product {
  title
  uri
  status
  siteScopes {
    nodes {
      ...ProductPageSiteScopeFields
    }
  }
}

fragment ProductPageDetailFields on Tio2Product {
  id
  databaseId
  slug
  title
  modifiedGmt
  status
  siteScopes {
    nodes {
      ...ProductPageSiteScopeFields
    }
  }
  productFields {
    productId
    family {
      nodes {
        name
      }
    }
    metaTitle
    metaDescription
    eyebrow
    customerProblemHeadline
    quickAnswer
    productType
    process
    primaryApplication
    positioning
    surfaceTreatment
    fitWhen {
      item
    }
    discussFirstWhen {
      item
    }
    performancePriorities {
      title
      explanation
    }
    recommendedApplications(first: 8) {
      nodes {
        ... on Tio2Application {
          ...ProductPageApplicationLinkFields
        }
      }
    }
    evidenceStatement
    typicalProperties {
      property
      value
      unit
      method
      note
      displayOrder
    }
    validationChecklist {
      item
    }
    packaging
    tdsAccess
    faqItems {
      question
      answer
    }
    relatedLinks {
      applications(first: 8) {
        nodes {
          ... on Tio2Application {
            ...ProductPageApplicationLinkFields
          }
        }
      }
      resources(first: 8) {
        nodes {
          ... on Tio2Document {
            ...ProductPageResourceLinkFields
          }
        }
      }
      products(first: 8) {
        nodes {
          ... on Tio2Product {
            ...ProductPageProductLinkFields
          }
        }
      }
    }
  }
}

query GetSiteProductsHub($siteId: String!) {
  tio2ProductsHub(siteId: $siteId) {
    siteId
    level
    path
    metaTitle
    metaDescription
    eyebrow
    headline
    directAnswer
    heroImageId
    decisionRail
    familyCount
    productCount
    families {
      ...ProductPageFamilySummaryFields
    }
    knownGradeHeading
    knownGradeHelp
    decisionPath
    applicationBoundary
    resources {
      ...ProductPageCollectionLinkFields
    }
    enquiry
    faqItems {
      ...ProductPageCollectionFaqFields
    }
    technicalDisclaimer
  }
}

query GetSiteProductFamily($siteId: String!, $slug: String!) {
  tio2ProductFamily(siteId: $siteId, slug: $slug) {
    siteId
    level
    path
    slug
    name
    metaTitle
    metaDescription
    eyebrow
    headline
    directAnswer
    heroImageId
    decisionRail
    filters {
      slug
      label
    }
    comparisonIntroduction
    comparisonCaption
    selectionMethod
    validationSteps
    products {
      ...ProductPageCollectionCardFields
    }
    applications {
      ...ProductPageCollectionLinkFields
    }
    resources {
      ...ProductPageCollectionLinkFields
    }
    enquiry
    faqItems {
      ...ProductPageCollectionFaqFields
    }
    technicalDisclaimer
  }
}

query GetSiteProductDetailPage($slug: ID!, $siteId: String!) {
  tio2Product(id: $slug, idType: SLUG) {
    ...ProductPageDetailFields
  }
  tio2ProductSettings(siteId: $siteId) {
    inquiryFields {
      key
      label
      guidance
    }
    requestTdsCta {
      label
      description
    }
    discussApplicationCta {
      label
      description
    }
    technicalDisclaimer
  }
}
