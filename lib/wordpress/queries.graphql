fragment ContentPageFields on Page {
  __typename
  id
  title
  content(format: RENDERED)
  modified
  status
  publishingFields {
    __typename
    publicPath
    seoTitle
    seoDescription
  }
  siteScopes {
    __typename
    nodes {
      __typename
      id
      slug
    }
  }
}

query GetContentByPath($uri: ID!) {
  page(id: $uri, idType: URI) {
    ...ContentPageFields
  }
}

query GetContentPage($siteId: ID!, $after: String) {
  siteScope(id: $siteId, idType: SLUG) {
    pages(first: 100, after: $after) {
      nodes {
        ...ContentPageFields
      }
      pageInfo {
        endCursor
        hasNextPage
      }
    }
  }
}
