<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TIOVAR Applications Visual Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0a1f44;
      --navy-2: #112d59;
      --white: #ffffff;
      --ice: #f5f7f9;
      --ink: #10203a;
      --muted: #5d687a;
      --steel: #657185;
      --rule: #c7ccd3;
      --rule-light: #e6e8ec;
      --focus: #4f82c4;
      --container: 1180px;
      --gutter: clamp(1.35rem, 5vw, 3.7rem);
      --section: clamp(4.25rem, 8vw, 5.5rem);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      overflow-x: hidden;
      background: var(--white);
      color: var(--ink);
      font-family: "Source Sans 3", Arial, sans-serif;
      font-size: 17px;
      line-height: 1.6;
    }
    button, input, textarea { font: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }
    h1, h2, h3, p, ul, ol { margin: 0; }
    h1, h2, h3 {
      font-family: "Space Grotesk", Arial, sans-serif;
      font-weight: 500;
      text-wrap: balance;
    }
    h1 {
      max-width: 13ch;
      font-size: clamp(2.8rem, 5.4vw, 4.9rem);
      line-height: .99;
      letter-spacing: -.045em;
    }
    h2 {
      max-width: 22ch;
      font-size: clamp(2rem, 3.4vw, 3rem);
      line-height: 1.08;
      letter-spacing: -.032em;
    }
    h3 {
      font-size: clamp(1.2rem, 1.7vw, 1.45rem);
      line-height: 1.18;
      letter-spacing: -.018em;
    }
    .no-break { white-space: nowrap; }
    .shell {
      width: min(100%, var(--container));
      margin-inline: auto;
      padding-inline: var(--gutter);
    }
    .eyebrow {
      color: var(--steel);
      font-family: "Space Grotesk", Arial, sans-serif;
      font-size: .78rem;
      font-weight: 500;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .section-copy {
      max-width: 50rem;
      color: var(--muted);
      font-size: 1.05rem;
    }
    .section-heading {
      display: grid;
      max-width: 56rem;
      gap: 1.1rem;
      margin-bottom: clamp(2.5rem, 5vw, 3.8rem);
    }
    .section {
      padding-block: var(--section);
    }
    .section.ice { background: var(--ice); }
    .button {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      gap: .55rem;
      padding: .72rem 1.15rem;
      border: 1px solid var(--navy);
      border-radius: 10px;
      background: var(--navy);
      color: var(--white);
      cursor: default;
      font-weight: 600;
      line-height: 1.1;
      text-decoration: none;
    }
    .button.secondary {
      background: var(--white);
      color: var(--navy);
    }
    .button.ghost {
      border-color: rgba(255,255,255,.55);
      background: rgba(255,255,255,.08);
      color: var(--white);
    }
    .button.small { min-height: 44px; padding-inline: 1rem; font-size: .92rem; }
    .button.tertiary {
      min-height: 44px;
      justify-content: flex-start;
      padding: .45rem 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--navy);
    }
    .actions { display: flex; flex-wrap: wrap; gap: .75rem; }

    .review-controls {
      position: fixed;
      z-index: 30;
      top: 92px;
      left: 16px;
      display: flex;
      gap: .4rem;
      padding: .45rem;
      border: 1px solid var(--rule-light);
      border-radius: 12px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 8px 30px rgba(10,31,68,.12);
    }
    .review-controls button {
      min-height: 38px;
      padding: .45rem .7rem;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: .82rem;
      font-weight: 600;
    }
    .review-controls button[aria-pressed="true"] { background: var(--navy); color: var(--white); }
    body.capture .review-controls { display: none; }

    .site-header {
      position: relative;
      z-index: 20;
      display: grid;
      grid-template-columns: auto minmax(0,1fr) auto;
      min-height: 78px;
      align-items: center;
      gap: clamp(1rem,3vw,2.5rem);
      padding: .75rem clamp(1.25rem,4vw,4rem);
      border-bottom: 1px solid var(--rule-light);
      background: var(--white);
    }
    .logo { display: block; width: 164px; height: auto; }
    .nav {
      display: flex;
      justify-content: center;
      gap: clamp(.75rem, 2vw, 1.6rem);
      color: var(--ink);
      font-size: .91rem;
      font-weight: 500;
      white-space: nowrap;
    }
    .nav span.active { color: var(--navy); font-weight: 600; }
    .menu-button {
      display: none;
      width: 44px;
      min-height: 44px;
      place-content: center;
      gap: 5px;
      border: 1px solid var(--rule-light);
      border-radius: 10px;
      background: var(--white);
    }
    .menu-button i { display: block; width: 20px; height: 2px; background: var(--navy); }
    .cta-short { display: none; }

    .hero {
      position: relative;
      display: flex;
      min-height: 660px;
      align-items: center;
      overflow: hidden;
      border-bottom: 6px solid var(--navy);
      background: linear-gradient(115deg, #fff 0%, #fff 48%, #f5f7f9 100%);
    }
    .hero::after {
      position: absolute;
      z-index: 2;
      right: 0;
      bottom: -6px;
      width: 31%;
      height: 6px;
      background: var(--rule);
      content: "";
    }
    .hero-media {
      position: absolute;
      z-index: 0;
      inset: 0 0 0 33%;
    }
    .hero-media::after {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #fff 0%, rgba(255,255,255,.94) 15%, rgba(255,255,255,.5) 39%, rgba(255,255,255,.04) 72%);
      content: "";
    }
    .hero-media img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
    .hero-content {
      position: relative;
      z-index: 3;
      display: grid;
      width: min(100%, var(--container));
      gap: 1.25rem;
      margin-inline: auto;
      padding: clamp(4rem, 7vw, 5.5rem) var(--gutter);
    }
    .breadcrumbs {
      display: flex;
      flex-wrap: wrap;
      gap: .45rem;
      color: var(--steel);
      font-size: .82rem;
    }
    .breadcrumbs span:not(:last-child)::after { margin-left: .45rem; content: "/"; color: var(--rule); }
    .hero-summary { max-width: 43rem; color: var(--muted); font-size: clamp(1.05rem, 1.8vw, 1.22rem); line-height: 1.55; }
    .decision-strip {
      position: relative;
      z-index: 5;
      border-bottom: 1px solid var(--rule-light);
      background: var(--white);
    }
    .decision-strip ol {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      margin: 0;
      padding-block: 1.7rem;
      list-style: none;
    }
    .decision-strip li {
      display: grid;
      grid-template-columns: 2rem 1fr;
      gap: .75rem;
      padding-right: 1.2rem;
      color: var(--muted);
      font-size: .92rem;
      line-height: 1.35;
    }
    .decision-strip li + li { padding-left: 1.2rem; border-left: 1px solid var(--rule-light); }
    .decision-strip a {
      display: grid;
      grid-template-columns: 2rem 1fr;
      gap: .75rem;
      color: inherit;
      text-decoration: none;
    }
    .decision-strip a:hover { color: var(--navy); }
    .number { color: var(--steel); font-family: "Space Grotesk", Arial, sans-serif; font-size: .82rem; }

    .application-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      border-top: 1px solid var(--rule);
      border-left: 1px solid var(--rule);
    }
    .application-card {
      display: grid;
      min-height: 240px;
      align-content: space-between;
      gap: 2.2rem;
      padding: clamp(1.5rem, 3vw, 2.1rem);
      border-right: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      border-top: 4px solid var(--navy);
      background: var(--white);
    }
    .application-card p { margin-top: .8rem; color: var(--muted); }
    .card-foot { display: flex; align-items: center; justify-content: space-between; color: var(--steel); font-size: .82rem; }
    .arrow { color: var(--navy); font-size: 1.3rem; }
    .cross-route {
      display: grid;
      grid-template-columns: minmax(13rem,.65fr) minmax(0,1.35fr);
      gap: clamp(2rem,6vw,5rem);
      margin-top: 1.35rem;
      padding: clamp(2rem,4vw,3rem);
      border-top: 4px solid var(--navy);
      background: var(--ice);
    }
    .cross-route p { color: var(--muted); }
    .text-link { display: inline-flex; align-items: center; gap: .55rem; margin-top: 1.1rem; color: var(--navy); font-weight: 600; }

    .split {
      display: grid;
      grid-template-columns: minmax(15rem,.72fr) minmax(0,1.28fr);
      gap: clamp(3rem,8vw,7rem);
      align-items: start;
    }
    .split-intro { display: grid; gap: 1.1rem; }
    .factor-list, .product-list, .input-list { margin: 0; padding: 0; list-style: none; }
    .factor-list li {
      display: grid;
      grid-template-columns: 2.5rem minmax(0,1fr);
      gap: 1rem;
      padding: 1.25rem 0;
      border-top: 1px solid var(--rule);
    }
    .factor-list li:last-child { border-bottom: 1px solid var(--rule); }
    .factor-list p { margin-top: .35rem; color: var(--muted); }
    .evidence-note {
      display: grid;
      gap: .7rem;
      margin-top: 2rem;
      padding: 1.35rem 1.5rem;
      border-left: 4px solid var(--navy);
      background: var(--ice);
    }
    .evidence-note h3 { font-size: 1.05rem; }
    .evidence-note p { color: var(--muted); font-size: .96rem; }

    .validation {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      border-top: 1px solid var(--rule);
      border-left: 1px solid var(--rule);
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .validation li {
      min-height: 245px;
      padding: 1.8rem;
      border-top: 4px solid var(--navy);
      border-right: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      background: var(--white);
    }
    .validation .number { display: block; margin-bottom: 2.1rem; }
    .validation p { margin-top: .7rem; color: var(--muted); }

    .route-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      border-top: 1px solid var(--rule);
      border-left: 1px solid var(--rule);
    }
    .route-card {
      display: grid;
      grid-template-columns: 3rem 1fr auto;
      gap: 1.15rem;
      align-items: start;
      padding: 1.65rem;
      border-right: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      background: var(--white);
      transition: background-color .16s ease;
    }
    .route-card:hover, .route-card:focus-visible { background: var(--ice); outline: 0; }
    .route-card:last-child:nth-child(odd) { grid-column: 1 / -1; }
    .route-card p { margin-top: .4rem; color: var(--muted); }

    .matrix { border-top: 1px solid var(--rule); }
    .matrix-head {
      display: grid;
      grid-template-columns: minmax(10rem,.8fr) minmax(7rem,.45fr) minmax(0,1.15fr);
      gap: 1.25rem;
      padding: .8rem 0;
      border-bottom: 1px solid var(--rule);
      color: var(--steel);
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .matrix-row {
      display: grid;
      grid-template-columns: minmax(10rem,.8fr) minmax(7rem,.45fr) minmax(0,1.15fr);
      gap: 1.25rem;
      align-items: start;
      padding: 1.25rem 0;
      border-bottom: 1px solid var(--rule);
    }
    .matrix-row summary {
      display: contents;
      cursor: default;
      list-style: none;
    }
    .matrix-row summary::-webkit-details-marker { display: none; }
    .matrix-application { color: var(--ink); font-family: "Space Grotesk", Arial, sans-serif; font-weight: 500; }
    .matrix-grade { color: var(--navy); font-family: "Space Grotesk", Arial, sans-serif; font-size: 1.05rem; font-weight: 600; }
    .matrix-copy { color: var(--muted); }
    .matrix-toggle { display: none; }

    .product-feature {
      display: grid;
      grid-template-columns: minmax(0,1.15fr) minmax(15rem,.85fr);
      gap: clamp(2rem,5vw,4.5rem);
      padding: clamp(2rem,5vw,3.6rem);
      border-top: 4px solid var(--navy);
      background: var(--white);
    }
    .product-kicker { color: var(--steel); font-size: .78rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
    .product-grade { margin-top: .6rem; color: var(--navy); font-size: clamp(2.7rem,5vw,4.8rem); line-height: 1; }
    .product-feature p { margin-top: 1rem; color: var(--muted); }
    .product-actions { display: grid; align-content: start; gap: .75rem; }
    .alternatives { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 1px; margin-top: 1px; background: var(--rule); }
    .alternative { padding: 1.6rem; border-top: 4px solid var(--navy); background: var(--white); }
    .alternative p { margin-top: .55rem; color: var(--muted); }

    .resources {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 1rem;
    }
    .resource-card {
      display: flex;
      flex-direction: column;
      min-height: 205px;
      padding: 1.5rem;
      border: 1px solid var(--rule-light);
      border-top: 4px solid var(--navy);
      background: var(--white);
    }
    .resource-type { color: var(--steel); font-size: .78rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
    .resource-card h3 { margin-top: 1.2rem; }
    .resource-card p { margin-top: .6rem; color: var(--muted); font-size: .95rem; }
    .resource-card .text-link { margin-top: auto; padding-top: 1.2rem; }

    .document-panel {
      display: grid;
      grid-template-columns: minmax(0,1.2fr) minmax(15rem,.8fr);
      gap: clamp(2rem,6vw,5rem);
      align-items: center;
      padding: clamp(2rem,5vw,3.6rem);
      border: 1px solid var(--rule);
      border-top: 4px solid var(--navy);
      background: var(--white);
    }
    .document-panel p { max-width: 43rem; margin-top: .9rem; color: var(--muted); }
    .document-actions { display: grid; gap: .75rem; }

    .enquiry { background: var(--navy); color: var(--white); }
    .enquiry .eyebrow { color: #b9c6d8; }
    .enquiry h2 { color: var(--white); }
    .enquiry-layout {
      display: grid;
      grid-template-columns: minmax(15rem,.72fr) minmax(0,1.28fr);
      gap: clamp(3rem,8vw,7rem);
    }
    .enquiry-copy { display: grid; align-content: start; gap: 1.1rem; }
    .enquiry-copy p { color: #d4dce8; }
    .enquiry-form {
      display: grid;
      grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 1rem;
    }
    .field { display: grid; gap: .45rem; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: #d4dce8; font-size: .86rem; }
    .field input, .field textarea {
      width: 100%;
      min-height: 48px;
      padding: .7rem .85rem;
      border: 1px solid rgba(255,255,255,.4);
      border-radius: 6px;
      background: var(--white);
      color: var(--ink);
    }
    .field textarea { min-height: 118px; resize: none; }

    .faq-list { border-top: 1px solid var(--rule); }
    .faq-list details { border-bottom: 1px solid var(--rule); }
    .faq-list summary {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1.5rem;
      align-items: center;
      padding: 1.35rem 0;
      cursor: pointer;
      color: var(--ink);
      font-family: "Space Grotesk", Arial, sans-serif;
      font-size: 1.08rem;
      font-weight: 500;
      list-style: none;
    }
    .faq-list summary::-webkit-details-marker { display: none; }
    .faq-list summary::after { content: "+"; color: var(--steel); font-size: 1.5rem; font-weight: 400; }
    .faq-list details[open] summary::after { content: "–"; }
    .faq-list details p { max-width: 48rem; padding: 0 0 1.35rem; color: var(--muted); }

    .disclaimer { padding-block: 2rem; border-top: 1px solid var(--rule-light); background: var(--ice); }
    .disclaimer .shell { display: grid; grid-template-columns: 10rem 1fr; gap: 2rem; }
    .disclaimer strong { color: var(--navy); font-family: "Space Grotesk", Arial, sans-serif; font-weight: 500; }
    .disclaimer p { color: var(--muted); font-size: .88rem; line-height: 1.5; }

    .site-footer { padding-block: 3.6rem 2.6rem; background: #07172f; color: var(--white); }
    .footer-top { display: grid; grid-template-columns: 1.6fr repeat(3,1fr); gap: 2.6rem; }
    .footer-logo { width: 150px; filter: brightness(0) invert(1); }
    .footer-intro p { max-width: 20rem; margin-top: 1.25rem; color: #cbd4e0; }
    .footer-col h3 { color: var(--white); font-size: 1rem; }
    .footer-col ul { display: grid; gap: .7rem; margin-top: .7rem; padding: 0; color: #d8dee7; list-style: none; font-size: .94rem; opacity: .76; }
    .footer-bottom { display: flex; justify-content: space-between; gap: 2rem; margin-top: 2.8rem; padding-top: 1.35rem; border-top: 1px solid rgba(255,255,255,.15); color: #d8dee7; font-size: .82rem; opacity: .65; }

    @media (max-width: 900px) {
      .nav { display: none; }
      .site-header { grid-template-columns: auto minmax(0,1fr) auto; }
      .site-header > .button { justify-self: end; }
      .menu-button { display: grid; }
      .application-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .resources { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .validation { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .footer-top { grid-template-columns: 1.2fr repeat(2,.8fr); }
      .footer-col:last-child { grid-column: 2 / 4; }
    }

    @media (max-width: 700px) {
      body { font-size: 16px; }
      .resource-card p, .section-copy, .factor-list p, .matrix-copy { font-size: 1rem; }
      .review-controls { top: 72px; left: 8px; right: 8px; overflow-x: auto; }
      .review-controls button { white-space: nowrap; }
      .hero {
        min-height: 780px;
        align-items: flex-start;
        background: var(--white);
      }
      .hero-media { inset: auto 0 0; height: 370px; }
      .hero-media::after { background: linear-gradient(180deg,#fff 0%,rgba(255,255,255,.82) 19%,rgba(255,255,255,.12) 55%); }
      .hero-content { padding-top: 3.35rem; padding-bottom: 410px; }
      .hero-summary { font-size: 1rem; }
      .decision-strip ol { grid-template-columns: 1fr; padding-block: .8rem; }
      .decision-strip li { padding: .8rem 0; }
      .decision-strip li + li { padding-left: 0; border-top: 1px solid var(--rule-light); border-left: 0; }
      .application-grid, .route-grid, .validation, .resources, .alternatives { grid-template-columns: 1fr; }
      .route-card:last-child:nth-child(odd) { grid-column: auto; }
      .cross-route, .split, .product-feature, .document-panel, .enquiry-layout { grid-template-columns: 1fr; }
      .matrix-head { display: none; }
      .matrix-row { display: block; padding: 0; }
      .matrix-row summary {
        display: grid;
        grid-template-columns: minmax(0,1fr) auto 1.5rem;
        gap: .75rem;
        align-items: center;
        min-height: 58px;
        cursor: pointer;
      }
      .matrix-row:not([open]) > .matrix-copy { display: none; }
      .matrix-row .matrix-copy {
        display: block;
        padding: 0 2.25rem 1.2rem 0;
        font-size: 1rem;
      }
      .matrix-grade { font-size: .94rem; }
      .matrix-toggle { display: block; color: var(--steel); font-size: 1.25rem; }
      .matrix-row[open] .matrix-toggle { transform: rotate(45deg); }
      .validation li { min-height: 0; }
      .validation .number { margin-bottom: 1rem; }
      .enquiry-form { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .disclaimer .shell { grid-template-columns: 1fr; gap: .6rem; }
      .footer-top { grid-template-columns: 1fr 1fr; }
      .footer-intro { grid-column: 1 / -1; }
      .footer-col:last-child { grid-column: auto; }
      .footer-bottom { flex-direction: column; }
    }

    @media (max-width: 440px) {
      :root { --gutter: 1.25rem; --section: 4rem; }
      h1 { font-size: clamp(2.65rem,13vw,3.45rem); }
      .site-header { grid-template-columns: auto minmax(0,1fr) auto; min-height: 64px; gap: .45rem; padding-inline: 1rem; }
      .logo { width: 126px; }
      .site-header > .button { min-height: 42px; padding: .55rem .65rem; font-size: .78rem; }
      .cta-full { display: none; }
      .cta-short { display: inline; }
      .hero { min-height: 790px; }
      .hero-media { height: 345px; }
      .hero-content { padding-bottom: 380px; }
      .actions .button { width: 100%; }
      .application-card { min-height: 220px; }
      .route-card { grid-template-columns: 2.2rem 1fr auto; padding: 1.25rem; }

          image: "assets/coatings-category-hero.png",

      function header() {
        return '<header class="site-header"><img class="logo" src="assets/tiovar-logo.png" alt="TIOVAR"><nav class="nav" aria-label="TIOVAR homepage sections"><span>Products</span><span class="active">Applications</span><span>Technical Resources</span><span>About TIOVAR</span><span>Contact</span></nav><button class="button small" type="button"><span class="cta-full">Discuss Your Requirement</span><span class="cta-short">Enquire</span></button><button class="menu-button" type="button" aria-label="Open navigation menu"><i></i><i></i><i></i></button></header>';
      }

      function hero(page) {
        return '<section class="hero"><div class="hero-media"><img src="' + page.image + '" alt=""></div><div class="hero-content"><div class="breadcrumbs">' + page.trail.map(function(x){return '<span>'+x+'</span>';}).join('') + '</div><p class="eyebrow">' + page.eyebrow + '</p><h1>' + (page.displayTitle || page.title) + '</h1><p class="hero-summary">' + page.summary + '</p><div class="actions"><button class="button" type="button">Discuss Your Requirement</button><button class="button secondary" type="button">Request Technical Documents</button></div></div></section><nav class="decision-strip" aria-label="On this page"><ol class="shell">' + page.map.map(function(x){return '<li><a href="#'+x[2]+'"><span class="number">'+x[0]+'</span><span>'+x[1]+'</span></a></li>';}).join('') + '</ol></nav>';
      }

      function sectionHeading(eyebrow, title, copy) {
        return '<div class="section-heading"><p class="eyebrow">' + eyebrow + '</p><h2>' + title + '</h2>' + (copy ? '<p class="section-copy">' + copy + '</p>' : '') + '</div>';
      }

      function factors(items, limitation, title, intro) {
        return '<section id="selection" class="section ice"><div class="shell split"><div class="split-intro"><p class="eyebrow">Selection Factors</p><h2>' + title + '</h2><p class="section-copy">' + intro + '</p></div><div><ol class="factor-list">' + items.map(function(x,i){return '<li><span class="number">0'+(i+1)+'</span><div><h3>'+x[0]+'</h3><p>'+x[1]+'</p></div></li>';}).join('') + '</ol><aside class="evidence-note"><h3>Evidence boundary</h3><p>' + limitation + '</p></aside></div></div></section>';
      }

      function validation(items) {
        return '<section id="validation" class="section"><div class="shell">' + sectionHeading('Validation Path','Move from pigment identity to finished-product evidence','Keep candidate and control under matched conditions at every stage so the final decision reflects the intended application.') + '<ol class="validation">' + items.map(function(x,i){return '<li><span class="number">0'+(i+1)+'</span><h3>'+x[0]+'</h3><p>'+x[1]+'</p></li>';}).join('') + '</ol></div></section>';
      }

      function resources(items) {
        return '<section class="section ice"><div class="shell">' + sectionHeading('Related Technical Resources','Continue the technical evaluation','Use these related product, application and technical-resource paths to prepare a more complete comparison.') + '<div class="resources">' + items.map(function(x){return '<article class="resource-card"><p class="resource-type">'+x[0]+'</p><h3>'+x[1]+'</h3><p>'+x[2]+'</p><span class="text-link">Review path <span>→</span></span></article>';}).join('') + '</div></div></section>';
      }

      function documents() {
        return '<section class="section"><div class="shell"><div class="document-panel"><div><p class="eyebrow">Controlled Documents</p><h2>Request the documents needed for your evaluation</h2><p>Technical Data Sheets and supporting documents are available through a controlled request. Identify the application, candidate grade and evaluation stage so the relevant information can be prepared.</p></div><div class="document-actions"><button class="button" type="button">Request Technical Documents</button><button class="button secondary" type="button">Discuss Your Requirement</button></div></div></div></section>';
      }

      function enquiry(inputs, pageName) {
        return '<section id="inquiry" class="section enquiry"><div class="shell enquiry-layout"><div class="enquiry-copy"><p class="eyebrow">Technical Enquiry</p><h2>Prepare a useful application discussion</h2><p>Share enough system and test context for TIOVAR to understand the decision you are making.</p><ol class="input-list">' + inputs.slice(0,5).map(function(x,i){return '<li style="display:grid;grid-template-columns:2rem 1fr;gap:.8rem;padding:.75rem 0;border-top:1px solid rgba(255,255,255,.2)"><span class="number" style="color:#b9c6d8">0'+(i+1)+'</span><span style="color:#d4dce8">'+x+'</span></li>';}).join('') + '</ol></div><form class="enquiry-form"><div class="field"><label>Name</label><input value="" placeholder="Your name"></div><div class="field"><label>Company</label><input value="" placeholder="Company name"></div><div class="field"><label>Email</label><input value="" placeholder="name@company.com"></div><div class="field"><label>Application</label><input value="' + pageName + '"></div><div class="field full"><label>Requirement</label><textarea placeholder="Tell us about the formulation, process and evaluation target."></textarea></div><div class="field full"><button class="button secondary" type="button">Discuss Your Requirement</button></div></form></div></section>';
      }

      function faq(items) {
        return '<section class="section"><div class="shell">' + sectionHeading('FAQ','Questions before you begin testing','Short answers that keep the evaluation focused on the actual material system and finished-product decision.') + '<div class="faq-list">' + items.map(function(x,i){return '<details '+(i===0?'open':'')+'><summary>'+x[0]+'</summary><p>'+x[1]+'</p></details>';}).join('') + '</div></div></section>';

      }

        return '<section id="application-families" class="section"><div class="shell">' + sectionHeading('Application Families','Start with the material system','Choose the route that matches the actual formulation, process and finished-product requirements.') + '<div class="application-grid">' + page.categories.map(function(x,i){return '<article class="application-card"><div><span class="number">0'+(i+1)+'</span><h3 style="margin-top:1.2rem">'+x[0]+'</h3><p>'+x[1]+'</p></div><div class="card-foot"><span>Explore application</span><span class="arrow">→</span></div></article>';}).join('') + '</div><div class="cross-route"><div><p class="eyebrow">Cross-application</p><h3 style="margin-top:.8rem">Multi-Purpose Titanium Dioxide</h3></div><div><p>Multi-Purpose Titanium Dioxide for Coatings, Inks & Plastics is a separate screening route. “Multi-purpose” does not establish suitability across systems; every programme needs its own formulation, process and final-product validation.</p><span class="text-link">Review the separate evaluation route →</span></div></div></div></section>';
      }

      function categoryBody(page) {
        return '<section id="application-routes" class="section"><div class="shell">' + sectionHeading('Coatings Applications','Choose the coating route','Each route brings different binder, process, film and exposure requirements into the qualification plan.') + '<div class="route-grid">' + page.routes.map(function(x,i){return '<article class="route-card" tabindex="0" role="link"><span class="number">0'+(i+1)+'</span><div><h3>'+x[0]+'</h3><p>'+x[1]+'</p></div><span class="arrow">→</span></article>';}).join('') + '</div></div></section>' + '<section id="starting-grades" class="section ice"><div class="shell split"><div class="split-intro"><p class="eyebrow">Selection Matrix</p><h2>Connect each coating decision to a testable candidate</h2><p class="section-copy">These are evidence-backed starting points, not automatic selections or performance guarantees.</p></div><div class="matrix"><div class="matrix-head"><span>Application</span><span>Starting grade</span><span>Evaluation direction</span></div>' + page.products.map(function(x,i){var parts=x[1].split(' — ');return '<details class="matrix-row" '+((window.innerWidth>700||i===0)?'open':'')+'><summary><span class="matrix-application">'+x[0]+'</span><span class="matrix-grade">'+parts[0]+'</span><span class="matrix-toggle">+</span></summary><p class="matrix-copy">'+(parts[1]||'')+'</p></details>';}).join('') + '</div></div></section>';
      }

      function detailBody(page) {
        return '<section id="starting-grade" class="section ice"><div class="shell">' + sectionHeading('Product Starting Point','Begin with the primary candidate','TP-C120 is presented first for this application. Alternatives remain separate evaluation paths.') + '<div class="product-feature"><div><p class="product-kicker">Primary starting point</p><h3 class="product-grade">TP-C120</h3><p>TP-C120 is the primary TIOVAR starting point for interior and exterior water-based wall-emulsion paint, with a documented product direction toward low-viscosity processing, bluish undertone, gloss, durability and hiding performance. Final suitability should be confirmed in the intended formulation.</p></div><div class="product-actions"><button class="button" type="button">View TP-C120</button><button class="button secondary" type="button">Request Technical Documents</button><button class="button tertiary" type="button">Request a Sample →</button><button class="button tertiary" type="button">Discuss Your Requirement →</button></div></div><div class="alternatives"><article class="alternative"><p class="product-kicker">Secondary candidate</p><h3 style="margin-top:.55rem">TP-C100</h3><p>A separate starting point for relevant architectural, industrial and decorative waterborne coating directions. Evaluate it independently.</p></article><article class="alternative"><p class="product-kicker">Secondary candidate</p><h3 style="margin-top:.55rem">TP-C110</h3><p>A separate starting point for relevant architectural, industrial and decorative waterborne coating directions. Evaluate it independently.</p></article></div></div></section><section id="application-context" class="section"><div class="shell split"><div class="split-intro"><p class="eyebrow">Application Context</p><h2>Understand the complete water-based paint system</h2><p class="section-copy">'+page.context+'</p></div><div class="split-intro"><p class="eyebrow">What to define before testing</p><h3>Make the trial comparable and decision-ready</h3><p class="section-copy">'+page.buyer+'</p><span class="text-link">Prepare the technical enquiry →</span></div></div></section>';
      }

      function render(key) {
        var page = pages[key] || pages.hub;
        var middle = key === 'hub' ? hubBody(page) : (key === 'category' ? categoryBody(page) : detailBody(page));
        var factorTitle = key === 'hub' ? 'Define the decision before comparing grades' : (key === 'category' ? 'Evaluate the complete coating system' : 'Evaluate the complete paint, not the powder alone');
        var factorIntro = key === 'hub' ? 'A useful selection route begins with the end-use decision and works backward into material, formulation and process variables.' : (key === 'category' ? 'Use the intended binder, formulation, process and exposure requirements as the common basis for comparison.' : 'Set the formulation and finished-film criteria before drawing conclusions from a candidate trial.');
        document.getElementById('app').innerHTML = header() + hero(page) + middle + factors(page.factors, page.limitation, factorTitle, factorIntro) + validation(page.validation) + resources(page.resources) + documents() + enquiry(page.inputs, page.name) + faq(page.faqs) + footer();
        document.querySelectorAll('[data-page]').forEach(function(button){button.setAttribute('aria-pressed', button.getAttribute('data-page') === key ? 'true' : 'false');});
        document.title = page.name + ' — TIOVAR Applications Visual Prototype';
      }

      document.querySelectorAll('[data-page]').forEach(function(button){
        button.addEventListener('click', function(){
          var key = button.getAttribute('data-page');
          var url = new URL(window.location.href);
          url.searchParams.set('page', key);
          history.replaceState({}, '', url);
          render(key);
          window.scrollTo(0,0);
        });
      });

      var params = new URLSearchParams(window.location.search);
      if (params.get('capture') === '1') document.body.classList.add('capture');
      render(params.get('page') || 'hub');
    }());
  </script>
