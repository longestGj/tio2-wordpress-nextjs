services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME}
      MARIADB_USER: ${WORDPRESS_DB_USER}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # The initialization socket server can answer ping before TCP and the
      # application database are ready. Check the connection WordPress needs.
      test: ["CMD-SHELL", "mariadb --protocol=TCP --host=127.0.0.1 --user=\"$${MARIADB_USER}\" --password=\"$${MARIADB_PASSWORD}\" \"$${MARIADB_DATABASE}\" --execute='SELECT 1' --skip-column-names"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 127.0.0.1:8080:80
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      NEXTJS_REVALIDATION_URL_TIO2_A: ${NEXTJS_REVALIDATION_URL_TIO2_A}
      NEXTJS_REVALIDATION_SECRET_TIO2_A: ${NEXTJS_REVALIDATION_SECRET_TIO2_A}
      NEXTJS_REVALIDATION_URL_TIO2_B: ${NEXTJS_REVALIDATION_URL_TIO2_B}
      NEXTJS_REVALIDATION_SECRET_TIO2_B: ${NEXTJS_REVALIDATION_SECRET_TIO2_B}
      NEXTJS_REVALIDATION_URL_TIO2_MY: ${NEXTJS_REVALIDATION_URL_TIO2_MY}
      NEXTJS_REVALIDATION_SECRET_TIO2_MY: ${NEXTJS_REVALIDATION_SECRET_TIO2_MY}
      NEXTJS_PREVIEW_URL_TIO2_A: ${NEXTJS_PREVIEW_URL_TIO2_A}
      NEXTJS_PREVIEW_SECRET_TIO2_A: ${NEXTJS_PREVIEW_SECRET_TIO2_A}
      NEXTJS_PREVIEW_URL_TIO2_B: ${NEXTJS_PREVIEW_URL_TIO2_B}
      NEXTJS_PREVIEW_SECRET_TIO2_B: ${NEXTJS_PREVIEW_SECRET_TIO2_B}
      NEXTJS_PREVIEW_URL_TIO2_MY: ${NEXTJS_PREVIEW_URL_TIO2_MY}
      NEXTJS_PREVIEW_SECRET_TIO2_MY: ${NEXTJS_PREVIEW_SECRET_TIO2_MY}
    volumes:
      - wp_data:/var/www/html
      - ./plugins/tio2-site-model:/var/www/html/wp-content/plugins/tio2-site-model:ro

  wpcli:
    image: wordpress:cli-php8.3
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_ADMIN_USER: ${WORDPRESS_ADMIN_USER}
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD}
      WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL}
      NEXTJS_REVALIDATION_URL_TIO2_A: ${NEXTJS_REVALIDATION_URL_TIO2_A}
      NEXTJS_REVALIDATION_SECRET_TIO2_A: ${NEXTJS_REVALIDATION_SECRET_TIO2_A}
      NEXTJS_REVALIDATION_URL_TIO2_B: ${NEXTJS_REVALIDATION_URL_TIO2_B}
      NEXTJS_REVALIDATION_SECRET_TIO2_B: ${NEXTJS_REVALIDATION_SECRET_TIO2_B}
      NEXTJS_REVALIDATION_URL_TIO2_MY: ${NEXTJS_REVALIDATION_URL_TIO2_MY}
      NEXTJS_REVALIDATION_SECRET_TIO2_MY: ${NEXTJS_REVALIDATION_SECRET_TIO2_MY}
      NEXTJS_PREVIEW_URL_TIO2_A: ${NEXTJS_PREVIEW_URL_TIO2_A}
      NEXTJS_PREVIEW_SECRET_TIO2_A: ${NEXTJS_PREVIEW_SECRET_TIO2_A}
      NEXTJS_PREVIEW_URL_TIO2_B: ${NEXTJS_PREVIEW_URL_TIO2_B}
      NEXTJS_PREVIEW_SECRET_TIO2_B: ${NEXTJS_PREVIEW_SECRET_TIO2_B}
      NEXTJS_PREVIEW_URL_TIO2_MY: ${NEXTJS_PREVIEW_URL_TIO2_MY}
      NEXTJS_PREVIEW_SECRET_TIO2_MY: ${NEXTJS_PREVIEW_SECRET_TIO2_MY}
    volumes:
      - wp_data:/var/www/html
      - ..:/workspace
      - ./plugins/tio2-site-model:/var/www/html/wp-content/plugins/tio2-site-model:ro
    working_dir: /var/www/html

volumes:
  db_data:
  wp_data:
